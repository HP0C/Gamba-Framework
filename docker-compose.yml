services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gamba
      POSTGRES_USER: gamba
      POSTGRES_PASSWORD: gamba
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamba -d gamba"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://gamba:gamba@postgres:5432/gamba?schema=public
      DIRECT_URL: postgresql://gamba:gamba@postgres:5432/gamba?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-development-refresh-secret-change-me}
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_SECONDS: 604800
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
      FRONTEND_URL: http://localhost:5173
      DEFAULT_WALLET_BALANCE: 0
      TRUELAYER_MODE: ${TRUELAYER_MODE:-sandbox}
      TRUELAYER_CLIENT_ID: ${TRUELAYER_CLIENT_ID:-}
      TRUELAYER_CLIENT_SECRET: ${TRUELAYER_CLIENT_SECRET:-}
      TRUELAYER_REDIRECT_URI: http://localhost:3000/api/banking/truelayer/callback
      TRUELAYER_MERCHANT_ACCOUNT_ID: ${TRUELAYER_MERCHANT_ACCOUNT_ID:-}
      TRUELAYER_CERTIFICATE_ID: ${TRUELAYER_CERTIFICATE_ID:-}
      TRUELAYER_PRIVATE_KEY: ${TRUELAYER_PRIVATE_KEY:-}
      TRUELAYER_AUTH_URL: ${TRUELAYER_AUTH_URL:-https://auth.truelayer-sandbox.com/connect/token}
      TRUELAYER_API_BASE_URL: ${TRUELAYER_API_BASE_URL:-https://api.truelayer-sandbox.com}
      TRUELAYER_DATA_PROVIDER_ID: ${TRUELAYER_DATA_PROVIDER_ID:-uk-cs-mock}
      TRUELAYER_PAYMENT_PROVIDER_ID: ${TRUELAYER_PAYMENT_PROVIDER_ID:-mock-payments-gb-redirect}
      TRUELAYER_PAYMENT_RETURN_URI: http://localhost:3000/api/banking/truelayer/payment-callback
      TRUELAYER_PAYMENT_HPP_BASE_URL: ${TRUELAYER_PAYMENT_HPP_BASE_URL:-https://app.truelayer-sandbox.com/payments}
      TRUELAYER_MANDATE_PROVIDER_ID: ${TRUELAYER_MANDATE_PROVIDER_ID:-ob-natwest-vrp-sandbox}
      TRUELAYER_MANDATE_TYPE: ${TRUELAYER_MANDATE_TYPE:-sweeping}
      TRUELAYER_MANDATE_TOKEN_SCOPE: ${TRUELAYER_MANDATE_TOKEN_SCOPE:-payments recurring_payments:sweeping}
      TRUELAYER_MANDATE_RETURN_URI: http://localhost:3000/api/banking/truelayer/mandate-callback
      TRUELAYER_MANDATE_HPP_BASE_URL: ${TRUELAYER_MANDATE_HPP_BASE_URL:-https://payment.truelayer-sandbox.com/mandates}
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  studio:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["npx", "prisma", "studio", "--hostname", "0.0.0.0", "--port", "5555"]
    environment:
      DATABASE_URL: postgresql://gamba:gamba@postgres:5432/gamba?schema=public
      DIRECT_URL: postgresql://gamba:gamba@postgres:5432/gamba?schema=public
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres_data:
